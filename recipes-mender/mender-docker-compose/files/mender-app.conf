# Readiness verification is enabled by default after rollout and before commit.
# Services with a container healthcheck must be healthy; services without one
# must be running. Mark intentional one-shot services with the Compose label
# io.ci4rail.mender.oneshot: "true"; they must exit with status 0.
APP_HEALTHCHECK_ENABLED=yes
APP_HEALTHCHECK_TIMEOUT=60
APP_HEALTHCHECK_INTERVAL=2

# Rollback snapshots live on persistent storage until Mender Cleanup.
# Allow room for the new payload, previous images, and any delta working files.
# PERSISTENT_STORE=/data/mender-app
